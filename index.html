<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b16" />
    <meta
      name="description"
      content="The official links for منـقطع النظـيـر 🇵🇸 — all accounts in one place."
    />
    <title>منـقطع النظـيـر 🇵🇸 | Official Links</title>
    <link rel="preload" href="assets/song-visual.gif" as="image" type="image/gif" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      :root {
        --ink: #f7f8ff;
        --muted: #a3a8bd;
        --deep: #080b16;
        --panel: rgba(19, 23, 42, 0.78);
        --line: rgba(255, 255, 255, 0.12);
        --gold: #ffd84d;
        --hot: #ff4d91;
        --cyan: #62e9ff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, rgba(255, 77, 145, 0.16), transparent 30rem),
          radial-gradient(circle at 92% 82%, rgba(98, 233, 255, 0.13), transparent 28rem),
          var(--deep);
        font-family: "Cairo", sans-serif;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 48px 48px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 90%);
      }

      a {
        color: inherit;
      }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 28px 18px;
      }

      .card {
        position: relative;
        width: min(100%, 480px);
        padding: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 32px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.025));
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(22px);
        animation: card-in 0.8s ease both;
      }

      .card::before,
      .card::after {
        position: absolute;
        z-index: -1;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        filter: blur(5px);
        content: "";
      }

      .card::before {
        top: -160px;
        right: -90px;
        background: rgba(255, 77, 145, 0.32);
      }

      .card::after {
        bottom: -170px;
        left: -100px;
        background: rgba(98, 233, 255, 0.24);
      }

      .card-inner {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 23px;
        background: linear-gradient(160deg, rgba(18, 22, 40, 0.96), rgba(8, 11, 22, 0.84));
      }

      .hero {
        position: relative;
        min-height: 292px;
        padding: 58px 24px 28px;
        overflow: hidden;
        text-align: center;
      }

      .hero::before {
        position: absolute;
        top: -130px;
        left: -20%;
        width: 145%;
        height: 270px;
        border-radius: 0 0 50% 50%;
        background:
          radial-gradient(circle at 40% 40%, rgba(255, 216, 77, 0.7), transparent 14%),
          linear-gradient(135deg, rgba(255, 77, 145, 0.82), rgba(98, 233, 255, 0.42));
        filter: blur(12px);
        opacity: 0.9;
        content: "";
        transform: rotate(-5deg);
      }

      .hero::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 40%, rgba(8, 11, 22, 0.9) 100%);
        content: "";
      }

      .hero-content {
        position: relative;
        z-index: 3;
      }

      .song-visual {
        position: absolute;
        z-index: 2;
        top: 53%;
        left: 50%;
        width: 100%;
        max-width: 100%;
        aspect-ratio: 3 / 2;
        pointer-events: none;
        opacity: 0;
        object-fit: cover;
        mix-blend-mode: screen;
        filter: contrast(1.08) saturate(1.15);
        transform: translate(-50%, -50%);
      }

      .song-visual.is-visible {
        animation: visual-bloom 5.5s linear forwards;
      }

      .music-player {
        position: absolute;
        z-index: 4;
        top: 10px;
        left: 10px;
        display: flex;
        align-items: center;
        width: 164px;
        height: 38px;
        gap: 7px;
        padding: 4px 5px 4px 4px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(24px) saturate(150%);
      }

      .music-toggle {
        display: grid;
        flex: 0 0 29px;
        width: 29px;
        height: 29px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        cursor: pointer;
        font-size: 0.62rem;
        transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      }

      .music-toggle:hover {
        background: rgba(255, 255, 255, 0.28);
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
        transform: scale(1.06);
      }

      .music-toggle:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      .music-player.is-playing .music-toggle {
        background: rgba(255, 216, 77, 0.72);
        border-color: rgba(255, 240, 161, 0.8);
        color: #101426;
      }

      .music-player.is-playing {
        border-color: rgba(255, 216, 77, 0.5);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24), 0 0 18px rgba(255, 216, 77, 0.12);
      }

      .music-player::after {
        position: absolute;
        top: 5px;
        right: 7px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        content: "";
        opacity: 0.8;
      }

      .music-player.is-playing::after {
        background: #73f6a2;
        box-shadow: 0 0 8px rgba(115, 246, 162, 0.9);
        color: #fff;
      }

      .song-window {
        min-width: 0;
        overflow: hidden;
        direction: ltr;
        white-space: nowrap;
      }

      .song-track {
        display: inline-block;
        color: #f5f6ff;
        font-family: "Cairo", sans-serif;
        font-size: 0.58rem;
        font-weight: 700;
        animation: song-marquee 8s linear infinite;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        padding: 7px 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        background: rgba(8, 11, 22, 0.36);
        color: #e7e9f5;
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        backdrop-filter: blur(12px);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #73f6a2;
        box-shadow: 0 0 0 4px rgba(115, 246, 162, 0.12), 0 0 16px rgba(115, 246, 162, 0.85);
      }

      .avatar-wrap {
        position: relative;
        width: 124px;
        height: 124px;
        margin: 0 auto 16px;
        padding: 5px;
        border-radius: 50%;
        background: conic-gradient(from 130deg, var(--gold), var(--hot), var(--cyan), var(--gold));
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.06), 0 12px 38px rgba(255, 77, 145, 0.3);
        animation: halo 5s linear infinite;
      }

      .avatar-wrap::after {
        position: absolute;
        right: 7px;
        bottom: 8px;
        width: 18px;
        height: 18px;
        border: 3px solid #111528;
        border-radius: 50%;
        background: #73f6a2;
        box-shadow: 0 0 16px rgba(115, 246, 162, 0.9);
        content: "";
      }

      .avatar {
        display: block;
        width: 100%;
        height: 100%;
        border: 4px solid #101426;
        border-radius: 50%;
        object-fit: cover;
        background: #202640;
      }

      .name {
        direction: rtl;
        font-size: clamp(1.6rem, 6vw, 2rem);
        font-weight: 800;
        line-height: 1.35;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.32);
      }

      .signature {
        margin-top: 4px;
        color: var(--muted);
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        direction: ltr;
      }

      .content {
        padding: 22px 20px 18px;
      }

      .intro {
        margin: 0 auto 18px;
        color: #dfe2f1;
        font-size: 0.98rem;
        line-height: 1.8;
        text-align: center;
      }

      .typed-line {
        display: block;
        min-height: 28px;
        margin-top: 3px;
        color: var(--gold);
        direction: ltr;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.7;
        text-align: center;
      }

      .links {
        display: grid;
        gap: 11px;
      }

      .link {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 64px;
        gap: 14px;
        padding: 10px 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.055);
        text-decoration: none;
        transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      }

      .link::before {
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        content: "";
        transform: translateX(120%);
        transition: transform 0.55s ease;
      }

      .link:hover {
        border-color: rgba(255, 216, 77, 0.6);
        background: rgba(255, 216, 77, 0.1);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
        transform: translateY(-3px);
      }

      .link:hover::before {
        transform: translateX(-120%);
      }

      .link:focus-visible {
        outline: 3px solid rgba(98, 233, 255, 0.7);
        outline-offset: 3px;
      }

      .link-icon {
        display: grid;
        flex: 0 0 43px;
        width: 43px;
        height: 43px;
        place-items: center;
        border-radius: 13px;
        color: #101426;
        font-size: 1.2rem;
      }

      .telegram .link-icon {
        background: #55bff3;
      }

      .instagram .link-icon {
        background: linear-gradient(135deg, #feda75, #d62976 55%, #4f5bd5);
        color: #fff;
      }

      .instagram-duo {
        cursor: default;
      }

      .instagram-accounts {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 3px;
      }

      .instagram-account {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        direction: ltr;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.75rem;
        text-decoration: none;
        transition: color 0.25s ease;
      }

      .instagram-account:hover {
        color: #fff;
      }

      .instagram-account i {
        font-size: 0.56rem;
        opacity: 0;
        transform: translateX(-3px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .instagram-account:hover i {
        opacity: 1;
        transform: translateX(0);
      }

      .instagram-divider {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.24);
      }

      .tiktok .link-icon {
        background: #f5f6fb;
      }

      .channel .link-icon {
        background: var(--gold);
      }

      .link-copy {
        display: grid;
        flex: 1;
        gap: 1px;
        text-align: left;
      }

      .link-title {
        color: #fff;
        font-size: 0.94rem;
        font-weight: 700;
      }

      .link-handle {
        color: var(--muted);
        direction: ltr;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.75rem;
        text-align: left;
      }

      .link-arrow {
        color: #8d94af;
        font-size: 0.78rem;
        transition: color 0.25s ease, transform 0.25s ease;
      }

      .link:hover .link-arrow {
        color: var(--gold);
        transform: translateX(4px);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 18px 8px 6px;
        color: #737b9a;
        font-size: 0.7rem;
      }

      .footer-mark {
        color: var(--hot);
        animation: pulse 1.8s ease-in-out infinite;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes halo {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        50% {
          opacity: 0.4;
          transform: scale(1.18);
        }
      }

      @keyframes song-marquee {
        0%,
        12% {
          transform: translateX(0);
        }
        88%,
        100% {
          transform: translateX(-52%);
        }
      }

      @keyframes visual-bloom {
        0% {
          opacity: 0;
        }
        8% {
          opacity: 0.92;
        }
        95.5% {
          opacity: 0.86;
        }
        100% {
          opacity: 0;
        }
      }

      @media (max-width: 430px) {
        .page {
          padding: 14px 10px;
        }

        .card {
          border-radius: 26px;
        }

        .hero {
          min-height: 270px;
          padding-top: 54px;
        }

        .content {
          padding-inline: 14px;
        }

        .music-player {
          width: 150px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>

    <script>
      const musicPlayer = document.getElementById("music-player");
      const musicToggle = document.getElementById("music-toggle");
      const playIcon = document.getElementById("play-icon");
      const profileSong = document.getElementById("profile-song");
      const songVisual = document.getElementById("song-visual");
      let visualPlayed = false;
      const visualSource = songVisual.getAttribute("src");

      const updateMusicButton = () => {
        const isPlaying = !profileSong.paused;
        musicPlayer.classList.toggle("is-playing", isPlaying);
        playIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        musicToggle.setAttribute("aria-label", isPlaying ? "Pause song" : "Play song");
      };

      const restartSongVisual = () => {
        songVisual.classList.remove("is-visible");
        songVisual.removeAttribute("src");
        songVisual.setAttribute("src", visualSource);
        void songVisual.offsetWidth;
        songVisual.classList.add("is-visible");
      };

      musicToggle.addEventListener("click", async () => {
        if (profileSong.paused) {
          await profileSong.play();
        } else {
          profileSong.pause();
        }
        updateMusicButton();
      });

      profileSong.addEventListener("play", () => {
        if (!visualPlayed) {
          visualPlayed = true;
          restartSongVisual();
        }
        updateMusicButton();
      });
      profileSong.addEventListener("pause", () => {
        songVisual.classList.remove("is-visible");
        updateMusicButton();
      });
      profileSong.addEventListener("ended", () => {
        songVisual.classList.remove("is-visible");
        visualPlayed = false;
        updateMusicButton();
      });
    </script>

  </body>
